[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-interviews"
version = "0.10.0.dev0"
description = "Canonical executable companion for Quant Interviews"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24",
  "scipy",
  "pandas",
  "statsmodels",
  "scikit-learn",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pyyaml",
  "jsonschema",
]
publication = [
  "matplotlib",
  "qrcode[pil]",
]

[tool.setuptools.packages.find]
where = ["../../_book/python"]

[tool.pytest.ini_options]
pythonpath = ["../../_book/python"]
testpaths = ["../tests"]
